<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Data - JK Byte</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        :root {
            --bg-color: #ecf0f3; --surface-color: #ecf0f3; --text-main: #2d3748; --text-muted: #718096;
            --brand-gradient: linear-gradient(135deg, #df20b9 0%, #00d2ff 100%);
            --shadow-out: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.8);
            --shadow-in: inset 6px 6px 10px 0 rgba(163,177,198, 0.6), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
            --logo-bg: transparent;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }
        [data-theme="dark"] {
            --bg-color: #1a1f24; --surface-color: #1a1f24; --text-main: #e2e8f0; --text-muted: #a0aec0;
            --shadow-out: 8px 8px 16px rgba(0,0,0,0.4), -8px -8px 16px rgba(255,255,255,0.05);
            --shadow-in: inset 5px 5px 10px rgba(0,0,0,0.6), inset -5px -5px 10px rgba(255,255,255,0.05);
            --logo-bg: #ffffff;
        }

        body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: 0.4s ease; }
        
        .header-simple { width: 100%; padding: 15px 20px; background: var(--surface-color); box-shadow: var(--shadow-out); box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 20px 20px; margin-bottom: 20px;}
        .header-simple a { text-decoration: none; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 40px; height: 40px; border-radius: 50%; background: var(--logo-bg); box-shadow: var(--shadow-out); padding: 2px; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        
        .admin-btn {
            background: var(--surface-color);
            color: #df20b9;
            border: none;
            font-size: 14px;
            font-weight: 800;
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: var(--shadow-out);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }
        .admin-btn:hover { box-shadow: var(--shadow-in); transform: translateY(-2px); }

        .theme-toggle { background: var(--surface-color); border: none; font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; box-shadow: var(--shadow-out); transition: 0.3s; }
        .theme-toggle:hover { box-shadow: var(--shadow-in); }

        .form-container { background: var(--surface-color); width: calc(100% - 40px); max-width: 480px; margin: 30px auto; padding: 40px; border-radius: 24px; box-shadow: var(--shadow-out); box-sizing: border-box; }
        .form-container h2 { text-align: center; margin-top: 0; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
        
        label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--text-muted); }
        
        /* 3D Inset Inputs */
        input, select { 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 25px; 
            border-radius: 12px; 
            font-size: 16px; 
            color: var(--text-main); 
            box-shadow: var(--shadow-in); 
            box-sizing: border-box; 
            outline: none; 
            transition: 0.3s;
            border: 2px solid transparent; 
            background: linear-gradient(var(--surface-color), var(--surface-color)) padding-box, var(--brand-gradient) border-box;
        }

        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300d2ff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"), linear-gradient(var(--surface-color), var(--surface-color));
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 15px auto, 100%;
            padding-right: 40px;
        }

        select option {
            background-color: var(--surface-color);
            color: var(--text-main);
            font-weight: 600;
        }

        input:focus, select:focus { 
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4), inset 2px 2px 5px rgba(0, 210, 255, 0.4), inset -2px -2px 5px rgba(223, 32, 185, 0.2); 
        }
        
        button { width: 100%; background: var(--brand-gradient); color: white; border: none; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); transition: 0.3s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(223, 32, 185, 0.4); }
        button:active { transform: translateY(2px); box-shadow: 0 5px 10px rgba(0, 210, 255, 0.2); }

        .link-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            margin-top: 25px; 
        }
        
        .link-container a { 
            color: #df20b9; 
            text-decoration: none; 
            font-weight: 800; 
            font-size: 16px; 
            padding: 12px 20px; 
            border-radius: 20px; 
            box-shadow: var(--shadow-out); 
            display: flex; 
            align-items: center;
            justify-content: center;
            gap: 10px; 
            transition: 0.3s;
            width: 100%; 
            box-sizing: border-box;
            white-space: nowrap; 
        }
        .link-container a:hover { box-shadow: var(--shadow-in); transform: translateY(-2px); }
        
        .telegram-link { color: #0088cc !important; }
        [data-theme="dark"] .telegram-link { color: #33aadd !important; }

        .success-msg { display: none; text-align: center; color: var(--success-color); margin-top: 20px; font-weight: 800; }

        /* --- 3D ADMIN MODAL STYLES --- */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .admin-content {
            background: var(--surface-color);
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: var(--shadow-out);
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(163,177,198,0.2);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .admin-header h3 {
            margin: 0;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
        }

        .admin-close-btn, .admin-logout-btn {
            background: var(--surface-color);
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: var(--shadow-out);
            font-weight: 700;
            cursor: pointer;
            color: var(--text-main);
            transition: 0.2s;
        }
        .admin-logout-btn { color: var(--danger-color); }
        .admin-close-btn:hover, .admin-logout-btn:hover { box-shadow: var(--shadow-in); }

        .admin-table-wrapper {
            overflow-y: auto;
            overflow-x: auto;
            flex: 1;
            box-shadow: var(--shadow-in);
            border-radius: 16px;
            padding: 10px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .admin-table th, .admin-table td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(163,177,198,0.2);
        }

        .admin-table th {
            color: #00d2ff;
            font-weight: 800;
            position: sticky;
            top: 0;
            background: var(--surface-color);
        }

        .btn-edit, .btn-delete {
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            margin-right: 6px;
        }
        .btn-edit { background: #00d2ff; color: #000; }
        .btn-delete { background: var(--danger-color); color: #fff; }
        .btn-edit:hover, .btn-delete:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header-simple">
        <a href="../">
            <img src="../logo.png" alt="Logo" class="header-logo"> ← Back to Home
        </a>
        <div class="header-actions">
            <button class="admin-btn" id="adminLoginBtn">🔐 Admin</button>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </div>

    <div class="form-container">
        <h2>Enter Candidate Details</h2>
        <form id="surveyForm">
            <label>Full Name</label>
            <input type="text" id="studentName" placeholder="Enter full name" required />
            
            <label>Exam Type</label>
            <select id="instructorType" required>
                <option value="" disabled selected>Select examination...</option>
                <option value="Basic Computer Instructor">Basic Computer Instructor</option>
                <option value="Senior Computer Instructor">Senior Computer Instructor</option>
            </select>
            
            <label>Category (Only Alphabets)</label>
            <!-- Strictly Alphabets Only Validation -->
            <input type="text" id="category" placeholder="Enter category (e.g., General, OBC)" 
                   pattern="[A-Za-z\s]+" 
                   title="Please enter alphabets only (e.g. General, OBC, SC, ST)" 
                   oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')" required />
            
            <label>Marks Obtained</label>
            <!-- Strictly Positive Number 0-200 Validation -->
            <input type="number" id="marks" placeholder="Marks out of 200" min="0" max="200" step="0.01" 
                   oninput="if(parseFloat(this.value)>200) this.value=200; if(parseFloat(this.value)<0) this.value=0;" required />
            
            <button type="submit">Submit Details</button>
            <div id="successMessage" class="success-msg">Data Saved Successfully!</div>
        </form>
        
        <div class="link-container">
            <a href="results/">View Leaderboard →</a>
            
            <a href="https://t.me/computer_instructor_pass_student" target="_blank" class="telegram-link">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.888-.667 3.473-1.512 5.79-2.511 6.952-2.998 3.305-1.385 3.992-1.625 4.437-1.632z"/>
                </svg>
                Join Telegram
            </a>
        </div>
    </div>

    <!-- ADMIN MODAL DIALOG -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <div class="admin-header">
                <h3>Admin Data Management</h3>
                <div style="display:flex; gap:10px;">
                    <button class="admin-logout-btn" id="adminLogoutBtn">Logout</button>
                    <button class="admin-close-btn" id="adminCloseBtn">✕ Close</button>
                </div>
            </div>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Exam Type</th>
                            <th>Category</th>
                            <th>Marks</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Admin data rendered here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLK2-2BJsYhwxKfcggWKdfRQI1lf_-tkM",
            authDomain: "computerinstructorsurvey.firebaseapp.com",
            projectId: "computerinstructorsurvey",
            storageBucket: "computerinstructorsurvey.firebasestorage.app",
            messagingSenderId: "878135244517",
            appId: "1:878135244517:web:f74375930e55ba645b460c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Specific Admin Email
        const ADMIN_EMAIL = "teamjkbyteclasses@gmail.com";

        // --- SUBMIT FORM DATA ---
        document.getElementById('surveyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Saving..."; btn.disabled = true;

            const name = document.getElementById('studentName').value.trim();
            const type = document.getElementById('instructorType').value;
            const category = document.getElementById('category').value.trim();
            const marks = parseFloat(document.getElementById('marks').value);

            try {
                await addDoc(collection(db, "instructor_survey"), {
                    student_name: name,
                    bharti_type: type,
                    category: category,
                    marks_obtained: marks,
                    timestamp: new Date()
                });
                document.getElementById('surveyForm').reset();
                document.getElementById('successMessage').style.display = "block";
                setTimeout(() => document.getElementById('successMessage').style.display = "none", 3000);
            } catch(err) { alert("Error: " + err.message); }
            btn.innerText = "Submit Details"; btn.disabled = false;
        });

        // --- ADMIN LOGIN / AUTHENTICATION ---
        const adminBtn = document.getElementById('adminLoginBtn');
        const adminModal = document.getElementById('adminModal');
        const adminCloseBtn = document.getElementById('adminCloseBtn');
        const adminLogoutBtn = document.getElementById('adminLogoutBtn');
        const adminTableBody = document.getElementById('adminTableBody');

        adminBtn.addEventListener('click', async () => {
            if(auth.currentUser && auth.currentUser.email === ADMIN_EMAIL) {
                openAdminPanel();
            } else {
                try {
                    const result = await signInWithPopup(auth, provider);
                    if(result.user.email === ADMIN_EMAIL) {
                        openAdminPanel();
                    } else {
                        alert("Unauthorized access! Only " + ADMIN_EMAIL + " can access the admin panel.");
                        await signOut(auth);
                    }
                } catch(error) {
                    alert("Login Failed: " + error.message);
                }
            }
        });

        async function openAdminPanel() {
            adminModal.style.display = 'flex';
            await loadAdminData();
        }

        adminCloseBtn.addEventListener('click', () => { adminModal.style.display = 'none'; });

        adminLogoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            adminModal.style.display = 'none';
            alert("Admin Logged Out Successfully!");
        });

        // --- LOAD AND DISPLAY DATA IN ADMIN PANEL ---
        async function loadAdminData() {
            adminTableBody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Loading Records...</td></tr>";
            try {
                const querySnapshot = await getDocs(collection(db, "instructor_survey"));
                adminTableBody.innerHTML = "";

                if(querySnapshot.empty) {
                    adminTableBody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No records found.</td></tr>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${data.student_name || 'N/A'}</strong></td>
                        <td>${data.bharti_type || 'N/A'}</td>
                        <td>${data.category || 'N/A'}</td>
                        <td style="color:#00d2ff; font-weight:800;">${data.marks_obtained !== undefined ? data.marks_obtained : 'N/A'}</td>
                        <td>
                            <button class="btn-edit" data-id="${docSnap.id}">✏️ Edit</button>
                            <button class="btn-delete" data-id="${docSnap.id}">🗑️ Delete</button>
                        </td>
                    `;
                    
                    // Edit Handler
                    tr.querySelector('.btn-edit').addEventListener('click', () => editRecord(docSnap.id, data));
                    // Delete Handler
                    tr.querySelector('.btn-delete').addEventListener('click', () => deleteRecord(docSnap.id));

                    adminTableBody.appendChild(tr);
                });
            } catch(e) {
                adminTableBody.innerHTML = `<tr><td colspan='5' style='color:red; text-align:center;'>Error loading data: ${e.message}</td></tr>`;
            }
        }

        // --- EDIT / UPDATE RECORD ---
        async function editRecord(id, oldData) {
            const newName = prompt("Update Student Name:", oldData.student_name || "");
            if(newName === null) return;

            const newType = prompt("Update Exam Type (Basic Computer Instructor / Senior Computer Instructor):", oldData.bharti_type || "");
            if(newType === null) return;

            let newCategory = prompt("Update Category (Alphabets only):", oldData.category || "");
            if(newCategory === null) return;
            newCategory = newCategory.replace(/[^a-zA-Z\s]/g, '');

            const newMarks = prompt("Update Marks (0 to 200):", oldData.marks_obtained !== undefined ? oldData.marks_obtained : "");
            if(newMarks === null) return;

            const parsedMarks = parseFloat(newMarks);
            if(isNaN(parsedMarks) || parsedMarks < 0 || parsedMarks > 200) {
                alert("Invalid marks! Must be between 0 and 200.");
                return;
            }

            try {
                const docRef = doc(db, "instructor_survey", id);
                await updateDoc(docRef, {
                    student_name: newName.trim(),
                    bharti_type: newType.trim(),
                    category: newCategory.trim(),
                    marks_obtained: parsedMarks
                });
                alert("Record updated successfully!");
                loadAdminData();
            } catch(err) {
                alert("Update failed: " + err.message);
            }
        }

        // --- DELETE RECORD ---
        async function deleteRecord(id) {
            if(confirm("Are you sure you want to permanently delete this student record?")) {
                try {
                    await deleteDoc(doc(db, "instructor_survey", id));
                    alert("Record deleted successfully!");
                    loadAdminData();
                } catch(err) {
                    alert("Delete failed: " + err.message);
                }
            }
        }

        // --- THEME TOGGLE LOGIC ---
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleBtn.innerHTML = currentTheme === 'dark' ? '☀️' : '🌙';
        toggleBtn.addEventListener('click', () => {
            let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleBtn.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
