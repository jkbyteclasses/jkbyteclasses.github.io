<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - JK Byte</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        :root {
            /* Light Theme 3D Colours */
            --bg-color: #ecf0f3; 
            --surface-color: #ecf0f3; 
            --text-main: #2d3748; 
            --text-muted: #718096;
            --brand-gradient: linear-gradient(135deg, #df20b9 0%, #00d2ff 100%);
            /* Outer shadow for 3D pop-out effect */
            --shadow-out: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.8);
            /* Inner shadow for pressed behaviour */
            --shadow-in: inset 6px 6px 10px 0 rgba(163,177,198, 0.6), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f5af19;
        }
        [data-theme="dark"] {
            /* Dark Theme 3D Colours */
            --bg-color: #1a1f24; 
            --surface-color: #1a1f24; 
            --text-main: #e2e8f0; 
            --text-muted: #a0aec0;
            --shadow-out: 8px 8px 16px rgba(0,0,0,0.4), -8px -8px 16px rgba(255,255,255,0.05);
            --shadow-in: inset 5px 5px 10px rgba(0,0,0,0.6), inset -5px -5px 10px rgba(255,255,255,0.05);
        }

        body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: 0.4s ease; padding: 20px; box-sizing: border-box; }
        
        .header-simple { width: 100%; padding: 15px 20px; background: var(--surface-color); box-shadow: var(--shadow-out); box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-radius: 20px; margin-bottom: 30px;}
        .header-simple a { text-decoration: none; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 40px; height: 40px; border-radius: 50%; background: transparent; box-shadow: var(--shadow-out); padding: 2px; }
        
        .theme-toggle { background: var(--surface-color); border: none; font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; box-shadow: var(--shadow-out); transition: 0.3s; }
        .theme-toggle:hover { box-shadow: var(--shadow-in); }

        .container { background: var(--surface-color); width: 100%; max-width: 1100px; padding: 40px; border-radius: 24px; box-shadow: var(--shadow-out); box-sizing: border-box; text-align: center; }
        
        h2 { background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 32px; margin-top: 0; }

        /* Login Section */
        #loginSection { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; }
        .login-btn { background: var(--brand-gradient); color: white; border: none; padding: 16px 30px; border-radius: 20px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(223, 32, 185, 0.4); }

        /* Admin Dashboard Section */
        #dashboardSection { display: none; width: 100%; flex-direction: column; align-items: center; }
        .dashboard-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout-btn { background: var(--surface-color); color: var(--danger-color); border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-out); transition: 0.3s; }
        .logout-btn:hover { box-shadow: var(--shadow-in); }

        .table-wrapper { width: 100%; overflow-x: auto; box-shadow: var(--shadow-in); border-radius: 16px; padding: 15px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(163,177,198,0.2); font-weight: 500; }
        th { color: #df20b9; font-weight: 800; white-space: nowrap; }
        
        /* Action buttons styling */
        .action-btn { border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-right: 5px; margin-bottom: 5px; display: inline-block; }
        .btn-edit { background: #00d2ff; color: #111; box-shadow: 0 4px 10px rgba(0, 210, 255, 0.3); }
        .btn-delete { background: var(--danger-color); color: #fff; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3); }
        .btn-verify { background: var(--success-color); color: #fff; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header-simple">
        <a href="index.html">
            <img src="../logo.png" alt="Logo" class="header-logo"> ← Back to Survey
        </a>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <h2>Admin Control Panel</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Only authorised administrators can access this area.</p>
            <button class="login-btn" id="loginBtn">
                <svg width="24" height="24" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection">
            <div class="dashboard-header">
                <h2>Manage Survey Records</h2>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Exam Type</th>
                            <th>Category</th>
                            <th>Marks</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Data rows will be injected here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        // Import necessary Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Initialise Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBLK2-2BJsYhwxKfcggWKdfRQI1lf_-tkM",
            authDomain: "computerinstructorsurvey.firebaseapp.com",
            projectId: "computerinstructorsurvey",
            storageBucket: "computerinstructorsurvey.firebasestorage.app",
            messagingSenderId: "878135244517",
            appId: "1:878135244517:web:f74375930e55ba645b460c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const adminTableBody = document.getElementById('adminTableBody');

        // Check login status automatically based on Firebase session
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'flex';
                loadAdminData();
            } else {
                loginSection.style.display = 'flex';
                dashboardSection.style.display = 'none';
            }
        });

        // Trigger Google Sign-In popup
        document.getElementById('loginBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch(error) {
                alert("Login Failed: " + error.message);
            }
        });

        // Log out the current user
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
        });

        // Fetch records from Firestore and populate the table initially
        async function loadAdminData() {
            adminTableBody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Loading Data...</td></tr>";
            try {
                // If the user lacks admin privileges in Firebase rules, this request will fail automatically.
                const querySnapshot = await getDocs(collection(db, "instructor_survey"));
                adminTableBody.innerHTML = "";

                if(querySnapshot.empty) {
                    adminTableBody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>No records found.</td></tr>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const tr = document.createElement('tr');
                    
                    // Determine the visual style of the status badge
                    let statusBadge = data.status === "approved" 
                                    ? `<span style="color:var(--success-color); font-weight:bold;">✅ Approved</span>`
                                    : `<span style="color:var(--warning-color); font-weight:bold;">⏳ Pending</span>`;

                    // Generate a Verify button only if the record is pending
                    let verifyBtnHtml = data.status !== "approved" 
                                      ? `<button class="action-btn btn-verify" data-id="${docSnap.id}">✅ Verify</button>` 
                                      : ``;

                    // Using specific classes on <td> elements for instant UI updates (No reload required)
                    tr.innerHTML = `
                        <td class="td-name"><strong>${data.student_name || ''}</strong></td>
                        <td class="td-type">${data.bharti_type || ''}</td>
                        <td class="td-category">${data.category || ''}</td>
                        <td class="td-marks" style="color:#00d2ff; font-weight:800;">${data.marks_obtained !== undefined ? data.marks_obtained : ''}</td>
                        <td class="td-status">${statusBadge}</td>
                        <td class="td-actions">
                            ${verifyBtnHtml}
                            <button class="action-btn btn-edit" data-id="${docSnap.id}">✏️ Edit</button>
                            <button class="action-btn btn-delete" data-id="${docSnap.id}">🗑️ Delete</button>
                        </td>
                    `;
                    
                    // Attach event listeners for instant DOM manipulation actions
                    if(data.status !== "approved") {
                        tr.querySelector('.btn-verify').addEventListener('click', function() {
                            approveRecord(docSnap.id, this, tr);
                        });
                    }
                    tr.querySelector('.btn-edit').addEventListener('click', function() {
                        editRecord(docSnap.id, data, tr);
                    });
                    tr.querySelector('.btn-delete').addEventListener('click', function() {
                        deleteRecord(docSnap.id, tr);
                    });

                    adminTableBody.appendChild(tr);
                });
            } catch(e) {
                // Deny access if the user is not defined in the Firebase security rules
                alert("Access Denied! You are not an authorised Admin. Logging you out...");
                await signOut(auth);
            }
        }

        // --- OPTIMISED FUNCTIONS (NO PAGE RELOAD / NO EXTRA FIREBASE READS) ---

        // Approve a pending record
        async function approveRecord(id, btnElement, trElement) {
            try {
                btnElement.disabled = true;
                btnElement.innerText = "⏳ Verifying...";
                
                // 1. Update backend
                await updateDoc(doc(db, "instructor_survey", id), { status: "approved" });
                
                // 2. Update frontend UI instantly
                trElement.querySelector('.td-status').innerHTML = `<span style="color:var(--success-color); font-weight:bold;">✅ Approved</span>`;
                btnElement.remove(); // Remove the verify button from the screen
                
            } catch(err) { 
                alert("Error approving record: " + err.message); 
                btnElement.disabled = false;
                btnElement.innerText = "✅ Verify";
            }
        }

        // Edit an existing record
        async function editRecord(id, oldData, trElement) {
            const newName = prompt("Update Student Name:", oldData.student_name || "");
            if(newName === null) return;
            const newType = prompt("Update Exam Type:", oldData.bharti_type || "");
            if(newType === null) return;
            let newCategory = prompt("Update Category (Alphabets only):", oldData.category || "");
            if(newCategory === null) return;
            newCategory = newCategory.replace(/[^a-zA-Z\s]/g, '');
            const newMarks = prompt("Update Marks (0 to 200):", oldData.marks_obtained !== undefined ? oldData.marks_obtained : "");
            if(newMarks === null) return;
            
            const parsedMarks = parseFloat(newMarks);
            if(isNaN(parsedMarks) || parsedMarks < 0 || parsedMarks > 200) {
                alert("Invalid marks provided!"); return;
            }

            try {
                // 1. Update backend
                await updateDoc(doc(db, "instructor_survey", id), {
                    student_name: newName.trim(), 
                    bharti_type: newType.trim(),
                    category: newCategory.trim(), 
                    marks_obtained: parsedMarks
                });
                
                // 2. Update frontend UI instantly (Without reloading data)
                trElement.querySelector('.td-name').innerHTML = `<strong>${newName.trim()}</strong>`;
                trElement.querySelector('.td-type').innerText = newType.trim();
                trElement.querySelector('.td-category').innerText = newCategory.trim();
                trElement.querySelector('.td-marks').innerText = parsedMarks;
                
                // Sync oldData object to reflect new values for future edits
                oldData.student_name = newName.trim();
                oldData.bharti_type = newType.trim();
                oldData.category = newCategory.trim();
                oldData.marks_obtained = parsedMarks;
                
                alert("Record updated successfully!");
            } catch(err) { 
                alert("Error updating record: " + err.message); 
            }
        }

        // Delete a record permanently
        async function deleteRecord(id, trElement) {
            if(confirm("Are you sure you want to permanently delete this record?")) {
                try {
                    // 1. Delete from backend
                    await deleteDoc(doc(db, "instructor_survey", id));
                    
                    // 2. Remove the row from the screen instantly
                    trElement.remove(); 
                } catch(err) { 
                    alert("Error deleting record: " + err.message); 
                }
            }
        }

        // Manage theme toggling behaviour
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleBtn.innerHTML = currentTheme === 'dark' ? '☀️' : '🌙';
        toggleBtn.addEventListener('click', () => {
            let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleBtn.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
