<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard Export</title>
    <!-- jsPDF & AutoTable Libraries for PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- SheetJS Library for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-pdf { background-color: #e74c3c; color: white; }
        .btn-excel { background-color: #27ae60; color: white; }
    </style>
</head>
<body>

    <h2>Leaderboard Data</h2>
    
    <button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
    <button class="btn-excel" onclick="downloadExcel()">Download Excel</button>

    <script>
        // Sample Data (Isme scores random hain)
        let studentsData = [
            { name: "Rahul", score: 85 },
            { name: "Priya", score: 98 },
            { name: "Amit", score: 62 },
            { name: "Neha", score: 91 }
        ];

        // 1. Common Helper Function: Data ko score ke hisab se SORT karne ke liye
        function getSortedData() {
            // b.score - a.score se highest score sabse upar aa jayega
            return [...studentsData].sort((a, b) => b.score - a.score);
        }

        // 2. PDF Download Function
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Sorted Data hasil karein
            const sortedData = getSortedData();

            // Rows format karein
            const tableRows = sortedData.map((item, index) => [index + 1, item.name, item.score]);

            doc.text("Leaderboard Results", 14, 15);
            doc.autoTable({
                head: [['Rank', 'Name', 'Score']],
                body: tableRows,
                startY: 20
            });

            doc.save("Leaderboard_HighToLow.pdf");
        }

        // 3. Excel Download Function
        function downloadExcel() {
            // Sorted Data hasil karein
            const sortedData = getSortedData();

            // Custom Headers ke sath Excel Rows banana
            const excelRows = sortedData.map((item, index) => ({
                "Rank": index + 1,
                "Name": item.name,
                "Score": item.score
            }));

            // SheetJS ka upyog karke Excel create karna
            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Leaderboard");

            // File Download karna
            XLSX.writeFile(workbook, "Leaderboard_HighToLow.xlsx");
        }
    </script>

</body>
</html>
