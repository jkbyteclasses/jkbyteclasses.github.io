<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Data - JK Byte</title>
    <link rel="icon" type="image/png" href="../logo_2.png">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --surface-color: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --border-color: rgba(0,0,0,0.1);
            --brand-gradient: linear-gradient(135deg, #d81b60 0%, #00bcd4 100%);
            --input-bg: #f9fafb;
            --shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: rgba(255,255,255,0.1);
            --input-bg: #0d1117;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        
        .header-simple { width: 100%; padding: 15px 20px; background: var(--surface-color); border-bottom: 1px solid var(--border-color); box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .header-simple a { text-decoration: none; color: var(--text-main); font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 35px; height: 35px; border-radius: 50%; background: #fff; padding: 2px; }
        
        .theme-toggle { background: transparent; border: none; font-size: 20px; cursor: pointer; }

        .form-container { background: var(--surface-color); width: 100%; max-width: 450px; margin: 40px 20px; padding: 40px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); box-sizing: border-box; }
        .form-container h2 { text-align: center; margin-top: 0; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
        input, select { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; background: var(--input-bg); color: var(--text-main); box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #00bcd4; }
        
        button { width: 100%; background: var(--brand-gradient); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        .link-container { text-align: center; margin-top: 20px; }
        .link-container a { color: #00bcd4; text-decoration: none; font-weight: 600; }

        .success-msg { display: none; text-align: center; color: #10b981; margin-top: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header-simple">
        <a href="../">
            <img src="../logo_2.png" alt="Logo" class="header-logo"> ← Home
        </a>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="form-container">
        <h2>Enter Candidate Details</h2>
        <form id="surveyForm">
            <label>Full Name</label>
            <input type="text" id="studentName" placeholder="Enter full name" required />
            <label>Exam Type</label>
            <select id="instructorType" required>
                <option value="" disabled selected>Select examination...</option>
                <option value="Basic Computer Instructor">Basic Computer Instructor</option>
                <option value="Senior Computer Instructor">Senior Computer Instructor</option>
            </select>
            <label>Category</label>
            <input type="text" id="category" placeholder="Enter category (e.g., General, OBC)" required />
            <label>Marks Obtained</label>
            <input type="number" id="marks" placeholder="Marks out of 200" min="0" max="200" step="0.01" required />
            <button type="submit">Submit Details</button>
            <div id="successMessage" class="success-msg">Data Saved Successfully!</div>
        </form>
        <div class="link-container">
            <a href="results/">View Leaderboard →</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLK2-2BJsYhwxKfcggWKdfRQI1lf_-tkM",
            authDomain: "computerinstructorsurvey.firebaseapp.com",
            projectId: "computerinstructorsurvey",
            storageBucket: "computerinstructorsurvey.firebasestorage.app",
            messagingSenderId: "878135244517",
            appId: "1:878135244517:web:f74375930e55ba645b460c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('surveyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Saving..."; btn.disabled = true;
            try {
                await addDoc(collection(db, "instructor_survey"), {
                    student_name: document.getElementById('studentName').value,
                    bharti_type: document.getElementById('instructorType').value,
                    category: document.getElementById('category').value,
                    marks_obtained: parseFloat(document.getElementById('marks').value),
                    timestamp: new Date()
                });
                document.getElementById('surveyForm').reset();
                document.getElementById('successMessage').style.display = "block";
                setTimeout(() => document.getElementById('successMessage').style.display = "none", 3000);
            } catch(err) { alert("Error: " + err.message); }
            btn.innerText = "Submit Details"; btn.disabled = false;
        });

        // Theme Toggle Logic
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleBtn.innerHTML = currentTheme === 'dark' ? '☀️' : '🌙';
        toggleBtn.addEventListener('click', () => {
            let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleBtn.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
