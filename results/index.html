<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Results - Download</title>
    
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #4facfe;
            --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-simple {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-sizing: border-box;
            position: absolute;
            top: 0;
        }
        
        .header-simple a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        
        .header-simple a:hover {
            color: var(--accent);
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 80px; /* Space for header */
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        .container h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container p {
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.6;
            font-size: 16px;
        }

        .btn-download {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(79, 172, 254, 0.4);
        }

        .btn-download:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* Stylish Footer */
        footer {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .team-badge {
            display: inline-block;
            padding: 10px 25px;
            background: #1d1d1f;
            color: white;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            margin-bottom: 15px;
        }

        .team-badge span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .team-badge:hover {
            transform: scale(1.05);
        }

        .contact-info {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .contact-info a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: #4facfe;
        }
    </style>
</head>
<body>

    <div class="header-simple">
        <a href="survey.html">← Back to Form</a>
    </div>

    <div class="content-wrapper">
        <div class="container">
            <h2>Survey Leaderboard</h2>
            <p>Download the complete list of candidates who participated in the survey, including their marks and categories, in PDF format.</p>
            
            <button id="downloadBtn" class="btn-download">Download PDF Report</button>
            <br>
            <a href="index.html" class="back-link">Return to Home →</a>
        </div>
    </div>

    <footer>
        <div class="team-badge">MADE BY <span>TEAM JKBYTE</span></div>
        <div class="contact-info">
            Contact us: <a href="mailto:teamjkbyte@gmail.com">teamjkbyte@gmail.com</a>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLK2-2BJsYhwxKfcggWKdfRQI1lf_-tkM",
            authDomain: "computerinstructorsurvey.firebaseapp.com",
            projectId: "computerinstructorsurvey",
            storageBucket: "computerinstructorsurvey.firebasestorage.app",
            messagingSenderId: "878135244517",
            appId: "1:878135244517:web:f74375930e55ba645b460c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const btn = document.getElementById('downloadBtn');
            btn.innerText = "Generating PDF... Please Wait";
            btn.disabled = true;

            try {
                const surveyRef = collection(db, "instructor_survey");
                const q = query(surveyRef, orderBy("marks_obtained", "desc"));
                const querySnapshot = await getDocs(q);
                
                let tableData = [];
                let sno = 1;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    tableData.push([
                        sno++, 
                        data.student_name || "N/A", 
                        data.bharti_type || "N/A", 
                        data.category || "N/A",
                        data.marks_obtained !== undefined ? data.marks_obtained : "N/A"
                    ]);
                });

                if (tableData.length === 0) {
                    alert("No data available to download yet.");
                    btn.innerText = "Download PDF Report";
                    btn.disabled = false;
                    return;
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Main Document Heading
                doc.setFontSize(20);
                doc.setTextColor(40, 40, 40);
                doc.text("Computer Instructor Exam - Leaderboard", 14, 22);
                
                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text("Generated officially via JK Byte Classes", 14, 28);

                // AutoTable Configuration with smart wrapping
                doc.autoTable({
                    startY: 34,
                    head: [['Rank', 'Student Name', 'Exam Type', 'Category', 'Marks (Out of 200)']],
                    body: tableData,
                    theme: 'grid',
                    styles: { 
                        fontSize: 10, 
                        cellPadding: 5,
                        valign: 'middle', // Keeps text vertically centered
                        overflow: 'linebreak' // Forces long text to wrap to the next line
                    },
                    headStyles: { 
                        fillColor: [79, 172, 254], 
                        textColor: 255,
                        halign: 'center',
                        fontStyle: 'bold'
                    },
                    columnStyles: {
                        0: { halign: 'center', cellWidth: 15 },    // Rank (fixed width)
                        1: { cellWidth: 'auto' },                  // Name (auto adjusts & wraps)
                        2: { cellWidth: 45 },                      // Exam type
                        3: { cellWidth: 35 },                      // Category
                        4: { halign: 'center', cellWidth: 35 }     // Marks
                    },
                    alternateRowStyles: { fillColor: [248, 250, 252] },
                    
                    // Add Page Numbers at bottom
                    didDrawPage: function (data) {
                        let str = "Page " + doc.internal.getNumberOfPages();
                        doc.setFontSize(9);
                        doc.setTextColor(150);
                        doc.text(str, data.settings.margin.left, doc.internal.pageSize.height - 10);
                    }
                });

                doc.save('Instructor_Exam_Leaderboard.pdf');

            } catch (error) {
                console.error("Error fetching data: ", error);
                alert("Error downloading data! Ensure Firebase Rules are set to Public Read.");
            }

            btn.innerText = "Download PDF Report";
            btn.disabled = false;
        });
    </script>
</body>
</html>
