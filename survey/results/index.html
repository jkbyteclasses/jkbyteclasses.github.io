<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - JK Byte</title>
    <link rel="icon" type="image/png" href="../../logo_2.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f6f9;
            --surface-color: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --border-color: rgba(0,0,0,0.1);
            --brand-gradient: linear-gradient(135deg, #d81b60 0%, #00bcd4 100%);
            --shadow: 0 10px 30px rgba(0,0,0,0.06);
            --th-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: rgba(255,255,255,0.1);
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
            --th-bg: #0d1117;
        }

        body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: 0.3s; }
        
        .header-simple { width: 100%; padding: 15px 20px; background: var(--surface-color); border-bottom: 1px solid var(--border-color); box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .header-simple a { text-decoration: none; color: var(--text-main); font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 35px; height: 35px; border-radius: 50%; background: #fff; padding: 2px; }
        
        .theme-toggle { background: transparent; border: none; font-size: 20px; cursor: pointer; }

        .container { background: var(--surface-color); padding: 40px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); text-align: center; max-width: 500px; width: 90%; margin-top: 40px; }
        .container h2 { margin-top: 0; background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-action { color: white; border: none; padding: 14px; border-radius: 20px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 12px; transition: 0.3s; }
        .btn-view { background: var(--brand-gradient); }
        .btn-excel { background: #10b981; }
        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); }

        .table-container { display: none; width: 100%; max-width: 900px; background: var(--surface-color); border-radius: 20px; padding: 20px; box-sizing: border-box; margin: 30px 0; overflow-x: auto; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        th { background: var(--th-bg); color: #00bcd4; }
    </style>
</head>
<body>

    <div class="header-simple">
        <a href="../">
            <img src="../../logo_2.png" alt="Logo" class="header-logo"> ← Form
        </a>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="container">
        <h2>Live Leaderboard</h2>
        <button id="viewBtn" class="btn-action btn-view">View Live Rankings</button>
        <button id="downloadPdfBtn" class="btn-action btn-view" style="background: #e00078;">Download PDF</button>
        <button id="downloadExcelBtn" class="btn-action btn-excel">Download Excel</button>
        <br><br>
        <a href="../../" style="color:#00bcd4; font-weight:600; text-decoration:none;">Go to Home</a>
    </div>

    <div id="tableContainer" class="table-container">
        <table>
            <thead><tr><th>Rank</th><th>Name</th><th>Exam</th><th>Category</th><th>Marks</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBLK2-2BJsYhwxKfcggWKdfRQI1lf_-tkM", authDomain: "computerinstructorsurvey.firebaseapp.com", projectId: "computerinstructorsurvey", storageBucket: "computerinstructorsurvey.firebasestorage.app", messagingSenderId: "878135244517", appId: "1:878135244517:web:f74375930e55ba645b460c" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchData() {
            let data = [];
            (await getDocs(collection(db, "instructor_survey"))).forEach(d => data.push(d.data()));
            return data.sort((a,b) => (b.marks_obtained||0) - (a.marks_obtained||0));
        }

        document.getElementById('viewBtn').onclick = async function() {
            let tc = document.getElementById('tableContainer');
            if(tc.style.display === 'block') { tc.style.display = 'none'; return; }
            this.innerText = "Loading...";
            try {
                let data = await fetchData();
                document.getElementById('tableBody').innerHTML = data.map((d,i) => `<tr><td>#${i+1}</td><td>${d.student_name}</td><td>${d.bharti_type}</td><td>${d.category}</td><td style="color:#00bcd4; font-weight:bold;">${d.marks_obtained}</td></tr>`).join('');
                tc.style.display = 'block';
            } catch(e) { alert("Error loading data"); }
            this.innerText = "View Live Rankings";
        };

        document.getElementById('downloadPdfBtn').onclick = async function() {
            this.innerText = "Generating...";
            try {
                let data = await fetchData();
                let { jsPDF } = window.jspdf; let doc = new jsPDF();
                doc.text("Leaderboard", 14, 20);
                doc.autoTable({ startY:30, head: [['Rank', 'Name', 'Exam', 'Category', 'Marks']], body: data.map((d,i) => [i+1, d.student_name, d.bharti_type, d.category, d.marks_obtained]) });
                doc.save('Leaderboard.pdf');
            } catch(e) {}
            this.innerText = "Download PDF";
        };

        document.getElementById('downloadExcelBtn').onclick = async function() {
            this.innerText = "Generating...";
            try {
                let data = await fetchData();
                let ws = XLSX.utils.json_to_sheet(data.map((d,i) => ({"Rank":i+1, "Name":d.student_name, "Exam":d.bharti_type, "Category":d.category, "Marks":d.marks_obtained})));
                let wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data");
                XLSX.writeFile(wb, 'Leaderboard.xlsx');
            } catch(e) {}
            this.innerText = "Download Excel";
        };

        // Theme Toggle Logic
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleBtn.innerHTML = currentTheme === 'dark' ? '☀️' : '🌙';
        toggleBtn.addEventListener('click', () => {
            let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleBtn.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
