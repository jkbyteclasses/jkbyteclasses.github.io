<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - JK Byte</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        :root {
            /* Light Theme 3D Colours */
            --bg-color: #ecf0f3; 
            --surface-color: #ecf0f3; 
            --text-main: #2d3748; 
            --text-muted: #718096;
            --brand-gradient: linear-gradient(135deg, #df20b9 0%, #00d2ff 100%);
            /* Outer shadow for 3D pop-out effect */
            --shadow-out: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.8);
            /* Inner shadow for pressed behaviour */
            --shadow-in: inset 6px 6px 10px 0 rgba(163,177,198, 0.6), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f5af19;
        }
        [data-theme="dark"] {
            /* Dark Theme 3D Colours */
            --bg-color: #1a1f24; 
            --surface-color: #1a1f24; 
            --text-main: #e2e8f0; 
            --text-muted: #a0aec0;
            --shadow-out: 8px 8px 16px rgba(0,0,0,0.4), -8px -8px 16px rgba(255,255,255,0.05);
            --shadow-in: inset 5px 5px 10px rgba(0,0,0,0.6), inset -5px -5px 10px rgba(255,255,255,0.05);
        }

        body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: 0.4s ease; padding: 20px; box-sizing: border-box; }
        
        .header-simple { width: 100%; padding: 15px 20px; background: var(--surface-color); box-shadow: var(--shadow-out); box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-radius: 20px; margin-bottom: 30px;}
        .header-simple a { text-decoration: none; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 40px; height: 40px; border-radius: 50%; background: transparent; box-shadow: var(--shadow-out); padding: 2px; }
        
        .theme-toggle { background: var(--surface-color); border: none; font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; box-shadow: var(--shadow-out); transition: 0.3s; }
        .theme-toggle:hover { box-shadow: var(--shadow-in); }

        .container { background: var(--surface-color); width: 100%; max-width: 1200px; padding: 30px; border-radius: 24px; box-shadow: var(--shadow-out); box-sizing: border-box; text-align: center; }
        
        h2 { background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 32px; margin-top: 0; }

        /* Login Section */
        #loginSection { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; }
        .login-btn { background: var(--brand-gradient); color: white; border: none; padding: 16px 30px; border-radius: 20px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(223, 32, 185, 0.4); }

        /* Admin Dashboard Section */
        #dashboardSection { display: none; width: 100%; flex-direction: column; align-items: center; }
        .dashboard-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        
        /* Sorting Controls */
        .controls-group { display: flex; align-items: center; gap: 10px; }
        .controls-group label { font-weight: 700; color: var(--text-muted); }
        .sort-select { padding: 8px 12px; border-radius: 12px; background: var(--surface-color); color: var(--text-main); border: 2px solid rgba(163,177,198,0.3); outline: none; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-in); }
        
        .logout-btn { background: var(--surface-color); color: var(--danger-color); border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: var(--shadow-out); transition: 0.3s; }
        .logout-btn:hover { box-shadow: var(--shadow-in); }

        .table-wrapper { width: 100%; overflow-x: auto; box-shadow: var(--shadow-in); border-radius: 16px; padding: 15px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(163,177,198,0.2); font-weight: 500; font-size: 14px; }
        th { color: #df20b9; font-weight: 800; white-space: nowrap; }
        
        /* Device ID Badge */
        .device-badge { background: rgba(113, 128, 150, 0.2); padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 12px; font-weight: bold; }
        .device-duplicate { background: var(--warning-color); color: #111; } /* Warning colour for spam */

        /* Action buttons styling */
        .action-btn { border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-right: 5px; margin-bottom: 5px; display: inline-block; }
        .btn-edit { background: #00d2ff; color: #111; box-shadow: 0 4px 10px rgba(0, 210, 255, 0.3); }
        .btn-delete { background: var(--danger-color); color: #fff; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3); }
        .btn-verify { background: var(--success-color); color: #fff; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header-simple">
        <a href="index.html">
            <img src="../logo.png" alt="Logo" class="header-logo"> ← Back to Survey
        </a>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <h2>Admin Control Panel</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Only authorised administrators can access this area.</p>
            <button class="login-btn" id="loginBtn">
                <svg width="24" height="24" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection">
            <div class="dashboard-header">
                <h2>Survey Records</h2>
                
                <!-- Sorting Dropdown -->
                <div class="controls-group">
                    <label for="sortSelect">Organise By:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="date">Date Added (Newest)</option>
                        <option value="marks">Marks (Highest)</option>
                        <option value="name">Name (A-Z)</option>
                        <option value="device">Device ID (Group Identical)</option>
                    </select>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Exam Type</th>
                            <th>Category</th>
                            <th>Marks</th>
                            <th>Device ID</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Data rows will be injected here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Initialise Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBLK2-2BJsYhwxKfcggWKdfRQI1lf_-tkM",
            authDomain: "computerinstructorsurvey.firebaseapp.com",
            projectId: "computerinstructorsurvey",
            storageBucket: "computerinstructorsurvey.firebasestorage.app",
            messagingSenderId: "878135244517",
            appId: "1:878135244517:web:f74375930e55ba645b460c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const adminTableBody = document.getElementById('adminTableBody');
        const sortSelect = document.getElementById('sortSelect');

        // Global array to store data locally (Prevents multiple Firebase reads)
        let adminRecords = [];

        // Check login status
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'flex';
                fetchDataFromFirebase();
            } else {
                loginSection.style.display = 'flex';
                dashboardSection.style.display = 'none';
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            try { await signInWithPopup(auth, provider); } catch(error) { alert("Login Failed: " + error.message); }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
        });

        // 1. FETCH DATA ONCE FROM FIREBASE
        async function fetchDataFromFirebase() {
            adminTableBody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Fetching Data...</td></tr>";
            try {
                const querySnapshot = await getDocs(collection(db, "instructor_survey"));
                adminRecords = [];
                
                querySnapshot.forEach((docSnap) => {
                    adminRecords.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Default Sort and Render
                sortAndRenderTable();

            } catch(e) {
                alert("Access Denied! You are not an authorised Admin. Logging you out...");
                await signOut(auth);
            }
        }

        // Event listener for sorting dropdown
        sortSelect.addEventListener('change', () => {
            sortAndRenderTable();
        });

        // 2. SORT AND RENDER DATA LOCALLY (Zero Extra Reads)
        function sortAndRenderTable() {
            const sortBy = sortSelect.value;

            // Sorting Logic
            if (sortBy === 'marks') {
                adminRecords.sort((a, b) => (b.marks_obtained || 0) - (a.marks_obtained || 0));
            } else if (sortBy === 'name') {
                adminRecords.sort((a, b) => (a.student_name || '').localeCompare(b.student_name || ''));
            } else if (sortBy === 'device') {
                adminRecords.sort((a, b) => (a.device_id || '').localeCompare(b.device_id || ''));
            } else {
                // Default date sort (Timestamp descending)
                adminRecords.sort((a, b) => {
                    const timeA = a.timestamp ? a.timestamp.seconds : 0;
                    const timeB = b.timestamp ? b.timestamp.seconds : 0;
                    return timeB - timeA;
                });
            }

            renderTableHTML();
        }

        function renderTableHTML() {
            if(adminRecords.length === 0) {
                adminTableBody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>No records found.</td></tr>";
                return;
            }

            adminTableBody.innerHTML = "";

            // Calculate Device ID frequencies to detect spam (Duplicates)
            const deviceCounts = {};
            adminRecords.forEach(r => {
                const did = r.device_id || 'Unknown';
                deviceCounts[did] = (deviceCounts[did] || 0) + 1;
            });

            // Build Rows
            adminRecords.forEach((data) => {
                const tr = document.createElement('tr');
                
                let statusBadge = data.status === "approved" 
                                ? `<span style="color:var(--success-color); font-weight:bold;">✅ Approved</span>`
                                : `<span style="color:var(--warning-color); font-weight:bold;">⏳ Pending</span>`;

                let verifyBtnHtml = data.status !== "approved" 
                                  ? `<button class="action-btn btn-verify">✅ Verify</button>` 
                                  : ``;
                
                // Device ID styling (Highlight if duplicate)
                const did = data.device_id || 'Unknown';
                const shortDid = did.length > 8 ? did.substring(0, 8) + '...' : did;
                const isDuplicate = deviceCounts[did] > 1 && did !== 'Unknown';
                const badgeClass = isDuplicate ? 'device-badge device-duplicate' : 'device-badge';
                const deviceTooltip = isDuplicate ? 'Multiple entries from this device!' : 'Unique Device';

                tr.innerHTML = `
                    <td><strong>${data.student_name || ''}</strong></td>
                    <td>${data.bharti_type || ''}</td>
                    <td>${data.category || ''}</td>
                    <td style="color:#00d2ff; font-weight:800;">${data.marks_obtained !== undefined ? data.marks_obtained : ''}</td>
                    <td><span class="${badgeClass}" title="${deviceTooltip}">${shortDid}</span></td>
                    <td>${statusBadge}</td>
                    <td>
                        ${verifyBtnHtml}
                        <button class="action-btn btn-edit">✏️ Edit</button>
                        <button class="action-btn btn-delete">🗑️ Delete</button>
                    </td>
                `;
                
                // Attach Event Listeners inside loop for local array manipulation
                if(data.status !== "approved") {
                    tr.querySelector('.btn-verify').addEventListener('click', () => actionApprove(data.id));
                }
                tr.querySelector('.btn-edit').addEventListener('click', () => actionEdit(data.id, data));
                tr.querySelector('.btn-delete').addEventListener('click', () => actionDelete(data.id));

                adminTableBody.appendChild(tr);
            });
        }

        // --- LOCAL ARRAY ACTIONS (Updates Backend + Local Memory, NO full reload) ---

        async function actionApprove(id) {
            try {
                // Update Backend
                await updateDoc(doc(db, "instructor_survey", id), { status: "approved" });
                // Update Local Array
                const record = adminRecords.find(r => r.id === id);
                if(record) record.status = "approved";
                // Re-render UI instantly
                sortAndRenderTable();
            } catch(err) { alert("Error approving record: " + err.message); }
        }

        async function actionEdit(id, oldData) {
            const newName = prompt("Update Student Name:", oldData.student_name || "");
            if(newName === null) return;
            const newType = prompt("Update Exam Type:", oldData.bharti_type || "");
            if(newType === null) return;
            let newCategory = prompt("Update Category (Alphabets only):", oldData.category || "");
            if(newCategory === null) return;
            newCategory = newCategory.replace(/[^a-zA-Z\s]/g, '');
            const newMarks = prompt("Update Marks (0 to 200):", oldData.marks_obtained);
            if(newMarks === null) return;
            
            const parsedMarks = parseFloat(newMarks);
            if(isNaN(parsedMarks) || parsedMarks < 0 || parsedMarks > 200) { alert("Invalid marks!"); return; }

            try {
                await updateDoc(doc(db, "instructor_survey", id), {
                    student_name: newName.trim(), 
                    bharti_type: newType.trim(),
                    category: newCategory.trim(), 
                    marks_obtained: parsedMarks
                });
                
                // Update Local Array
                const record = adminRecords.find(r => r.id === id);
                if(record) {
                    record.student_name = newName.trim();
                    record.bharti_type = newType.trim();
                    record.category = newCategory.trim();
                    record.marks_obtained = parsedMarks;
                }
                sortAndRenderTable();
                alert("Record updated successfully!");
            } catch(err) { alert("Error updating: " + err.message); }
        }

        async function actionDelete(id) {
            if(confirm("Are you sure you want to permanently delete this record?")) {
                try {
                    await deleteDoc(doc(db, "instructor_survey", id));
                    // Remove from local array
                    adminRecords = adminRecords.filter(r => r.id !== id);
                    sortAndRenderTable();
                } catch(err) { alert("Error deleting: " + err.message); }
            }
        }

        // Theme Toggle
        const toggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        toggleBtn.innerHTML = currentTheme === 'dark' ? '☀️' : '🌙';
        toggleBtn.addEventListener('click', () => {
            let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleBtn.innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
