<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Results - Download</title>
    
    <!-- jsPDF & AutoTable for PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <!-- SheetJS for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #4facfe;
            --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --excel-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-simple {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-sizing: border-box;
            position: absolute;
            top: 0;
        }
        
        .header-simple a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        
        .header-simple a:hover {
            color: var(--accent);
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 80px; 
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        .container h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container p {
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.6;
            font-size: 16px;
        }

        .btn-download {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.3);
            margin-bottom: 15px;
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(79, 172, 254, 0.4);
        }

        .btn-excel {
            background: var(--excel-gradient);
            box-shadow: 0 8px 20px rgba(56, 239, 125, 0.3);
        }

        .btn-excel:hover {
            box-shadow: 0 12px 25px rgba(56, 239, 125, 0.4);
        }

        .btn-download:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* Stylish Footer */
        footer {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .team-badge {
            display: inline-block;
            padding: 10px 25px;
            background: #1d1d1f;
            color: white;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            margin-bottom: 15px;
        }

        .team-badge span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .team-badge:hover {
            transform: scale(1.05);
        }

        .contact-info {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .contact-info a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: #4facfe;
        }
    </style>
</head>
<body>

    <div class="header-simple">
        <a href="../survey">← Back to Form</a>
    </div>

    <div class="content-wrapper">
        <div class="container">
            <h2>Survey Leaderboard</h2>
            <p>Download the complete list of candidates sorted by highest marks in PDF or Excel format.</p>
            
            <button id="downloadPdfBtn" class="btn-download">Download PDF Report</button>
            <button id="downloadExcelBtn" class="btn-download btn-excel">Download Excel Report</button>
            <br>
            <a href="../index.html" class="back-link">Return to Home →</a>
        </div>
    </div>

    <footer>
        <div class="team-badge">MADE BY <span>TEAM JKBYTE</span></div>
        <div class="contact-info">
            Contact us: <a href="mailto:teamjkbyte@gmail.com">teamjkbyte@gmail.com</a>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLK2-2BJsYhwxKfcggWKdfRQI1lf_-tkM",
            authDomain: "computerinstructorsurvey.firebaseapp.com",
            projectId: "computerinstructorsurvey",
            storageBucket: "computerinstructorsurvey.firebasestorage.app",
            messagingSenderId: "878135244517",
            appId: "1:878135244517:web:f74375930e55ba645b460c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Common function to fetch and sort data automatically (Highest marks on top)
        async function fetchAndSortData() {
            const surveyRef = collection(db, "instructor_survey");
            const querySnapshot = await getDocs(surveyRef);
            
            let rawData = [];
            querySnapshot.forEach((doc) => {
                rawData.push(doc.data());
            });

            // Sorting logic: Highest marks first
            rawData.sort((a, b) => {
                const marksA = parseFloat(a.marks_obtained) || 0;
                const marksB = parseFloat(b.marks_obtained) || 0;
                return marksB - marksA; // Descending order
            });

            return rawData;
        }

        // --- PDF DOWNLOAD LOGIC ---
        document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
            const btn = document.getElementById('downloadPdfBtn');
            btn.innerText = "Generating PDF...";
            btn.disabled = true;

            try {
                const sortedData = await fetchAndSortData();
                
                if (sortedData.length === 0) {
                    alert("No data available to download yet.");
                    btn.innerText = "Download PDF Report";
                    btn.disabled = false;
                    return;
                }

                let tableData = [];
                sortedData.forEach((data, index) => {
                    tableData.push([
                        index + 1, // Rank
                        data.student_name || "N/A", 
                        data.bharti_type || "N/A", 
                        data.category || "N/A",
                        data.marks_obtained !== undefined ? data.marks_obtained : "N/A"
                    ]);
                });

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFontSize(20);
                doc.setTextColor(40, 40, 40);
                doc.text("Computer Instructor Exam - Leaderboard", 14, 22);
                
                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text("Generated officially via JK Byte Classes", 14, 28);

                doc.autoTable({
                    startY: 34,
                    head: [['Rank', 'Student Name', 'Exam Type', 'Category', 'Marks (Out of 200)']],
                    body: tableData,
                    theme: 'grid',
                    styles: { 
                        fontSize: 10, 
                        cellPadding: 5,
                        valign: 'middle', 
                        overflow: 'linebreak' 
                    },
                    headStyles: { 
                        fillColor: [79, 172, 254], 
                        textColor: 255,
                        halign: 'center',
                        fontStyle: 'bold'
                    },
                    columnStyles: {
                        0: { halign: 'center', cellWidth: 15 },
                        1: { cellWidth: 'auto' },
                        2: { cellWidth: 45 },
                        3: { cellWidth: 35 },
                        4: { halign: 'center', cellWidth: 35 }
                    },
                    alternateRowStyles: { fillColor: [248, 250, 252] },
                    didDrawPage: function (data) {
                        let str = "Page " + doc.internal.getNumberOfPages();
                        doc.setFontSize(9);
                        doc.setTextColor(150);
                        doc.text(str, data.settings.margin.left, doc.internal.pageSize.height - 10);
                    }
                });

                doc.save('Instructor_Exam_Leaderboard.pdf');

            } catch (error) {
                console.error("Error generating PDF: ", error);
                alert("Error downloading PDF!");
            }

            btn.innerText = "Download PDF Report";
            btn.disabled = false;
        });

        // --- EXCEL DOWNLOAD LOGIC ---
        document.getElementById('downloadExcelBtn').addEventListener('click', async () => {
            const btn = document.getElementById('downloadExcelBtn');
            btn.innerText = "Generating Excel...";
            btn.disabled = true;

            try {
                const sortedData = await fetchAndSortData();
                
                if (sortedData.length === 0) {
                    alert("No data available to download yet.");
                    btn.innerText = "Download Excel Report";
                    btn.disabled = false;
                    return;
                }

                // Format data for Excel
                const excelData = sortedData.map((data, index) => ({
                    "Rank": index + 1,
                    "Student Name": data.student_name || "N/A",
                    "Exam Type": data.bharti_type || "N/A",
                    "Category": data.category || "N/A",
                    "Marks (Out of 200)": data.marks_obtained !== undefined ? data.marks_obtained : "N/A"
                }));

                // Create Worksheet and Workbook
                const worksheet = XLSX.utils.json_to_sheet(excelData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Leaderboard");

                // Auto-adjust column widths for Excel
                const columnWidths = [
                    { wch: 8 },  // Rank
                    { wch: 25 }, // Name
                    { wch: 30 }, // Exam Type
                    { wch: 15 }, // Category
                    { wch: 20 }  // Marks
                ];
                worksheet['!cols'] = columnWidths;

                // Download File
                XLSX.writeFile(workbook, 'Instructor_Exam_Leaderboard.xlsx');

            } catch (error) {
                console.error("Error generating Excel: ", error);
                alert("Error downloading Excel!");
            }

            btn.innerText = "Download Excel Report";
            btn.disabled = false;
        });
    </script>
</body>
</html>
